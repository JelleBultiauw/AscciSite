<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Een zwemmende beluga, helemaal in ASCII.">
  <title>AscciSite</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1110'/%3E%3Ctext x='9' y='43' font-family='monospace' font-weight='700' font-size='30' fill='%237ee787'%3E%26gt%3B_%3C/text%3E%3C/svg%3E">
  <style>
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
    }
    body {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      color: #e6edf0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-variant-ligatures: none;
      touch-action: none;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    .prompt {
      margin: 0;
      padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .user { color: #7ee787; }
    .path { color: #79c0ff; }
    .screen {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 8px max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    }
    #beluga {
      margin: 0;
      font: inherit;
      font-size: 12px;
      white-space: pre;
    }
  </style>
</head>
<body>
  <p class="prompt"><span class="user">guest@asccisite</span>:<span class="path">~</span>$ ./beluga<span id="status"></span></p>
  <main class="screen">
    <pre id="beluga" role="img" aria-label="Een zwemmende beluga, getekend met ASCII-tekens"></pre>
    <noscript>zet javascript aan om de beluga te zien</noscript>
  </main>
  <script>
    (() => {
      const box = document.querySelector('.screen');
      const pre = document.getElementById('beluga');
      const status = document.getElementById('status');
      const text = pre.appendChild(document.createTextNode('laden...'));
      const clips = {};
      let clip = null;
      let shown = -1;
      let paused = false;
      let offset = 0;
      let started = 0;

      const layout = () => (innerWidth < innerHeight ? 'tall' : 'wide');

      // media/beluga-*.txt: a "cols rows frames fps" header, then every frame's rows.
      function load(name) {
        clips[name] ??= fetch(`media/beluga-${name}.txt`)
          .then((res) => {
            if (!res.ok) throw new Error(res.status);
            return res.text();
          })
          .then((data) => {
            const lines = data.split(/\r?\n/);
            const [cols, rows, count, fps] = lines[0].split(' ').map(Number);
            const frames = [];
            for (let i = 0; i < count; i++) {
              const first = 1 + i * rows;
              frames.push(lines.slice(first, first + rows).map((l) => l.padEnd(cols)).join('\n'));
            }
            return { cols, rows, fps, frames };
          });
        return clips[name];
      }

      async function show() {
        const name = layout();
        let next;
        try {
          next = await load(name);
        } catch {
          text.data = 'kon de beluga niet laden.';
          return;
        }
        if (name !== layout()) return;
        if (!clip) started = performance.now();
        clip = next;
        shown = -1;
        fit();
      }

      // Glyph width per px of font size, measured in the font the page actually renders.
      function measureAdvance() {
        const probe = box.appendChild(document.createElement('span'));
        probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font-size:100px';
        probe.textContent = 'M'.repeat(100);
        const advance = probe.getBoundingClientRect().width / 10000;
        probe.remove();
        return advance;
      }

      // Largest font size at which the whole grid fits, with cells twice as tall as wide.
      let advance = 0;
      function fit() {
        advance ||= measureAdvance();
        const style = getComputedStyle(box);
        const width = box.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
        const height = box.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
        const cell = Math.min(width / clip.cols, height / clip.rows / 2);
        pre.style.fontSize = `${cell / advance}px`;
        pre.style.lineHeight = `${cell * 2}px`;
      }

      function draw(now) {
        if (clip) {
          // rAF timestamps can trail performance.now() slightly, so never go below zero.
          const time = Math.max(0, paused ? offset : offset + now - started);
          const i = Math.floor((time / 1000) * clip.fps) % clip.frames.length;
          if (i !== shown) {
            text.data = clip.frames[i];
            shown = i;
          }
        }
        requestAnimationFrame(draw);
      }

      function toggle() {
        if (!clip) return;
        const now = performance.now();
        if (paused) started = now;
        else offset += now - started;
        paused = !paused;
        status.textContent = paused ? '  [pauze]' : '';
      }

      addEventListener('pointerdown', (e) => {
        if (e.button === 0) toggle();
      });
      addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          toggle();
        }
      });
      new ResizeObserver(show).observe(box);
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
